config:
  target: "http://192.168.1.167:3001"
  phases:
    - duration: 30
      arrivalRate: 3
      name: "Calentamiento"
    - duration: 60
      arrivalRate: 10
      name: "Carga sostenida"
    - duration: 30
      arrivalRate: 20
      rampTo: 50
      name: "Pico de estres"
  defaults:
    headers:
      x-requested-with: "XMLHttpRequest"
      Content-Type: "application/json"

scenarios:
  - name: "Usuario consulta inventario"
    weight: 50
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "m.lopez@precisiontrucks.com"
            password: "Precisiontrucks.com1"
          capture:
            - json: "$.token"
              as: "jwt"
      - get:
          url: "/api/solicitudes/inventario"
          headers:
            Authorization: "Bearer {{ jwt }}"
          expect:
            - statusCode: 200

  - name: "Usuario consulta insumos disponibles"
    weight: 30
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "c.mendoza@precisiontrucks.com"
            password: "Precisiontrucks.com1"
          capture:
            - json: "$.token"
              as: "jwt"
      - get:
          url: "/api/solicitudes/insumos"
          headers:
            Authorization: "Bearer {{ jwt }}"
          expect:
            - statusCode: 200

  - name: "Usuario consulta stock bajo"
    weight: 20
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "a.ramirez@precisiontrucks.com"
            password: "Precisiontrucks.com1"
          capture:
            - json: "$.token"
              as: "jwt"
      - get:
          url: "/api/solicitudes/insumos/stock-bajo"
          headers:
            Authorization: "Bearer {{ jwt }}"
          expect:
            - statusCode: 200
