config:
  target: "http://192.168.1.167:3001"
  phases:
    - duration: 30
      arrivalRate: 3
      name: "Calentamiento"
    - duration: 60
      arrivalRate: 10
      name: "Carga sostenida"
    - duration: 30
      arrivalRate: 20
      rampTo: 50
      name: "Pico de estres"
  defaults:
    headers:
      x-requested-with: "XMLHttpRequest"
      Content-Type: "application/json"

  # Datos falsos variados para simular usuarios reales distintos
  variables:
    titulos:
      - "Computadora no enciende al presionar el boton"
      - "Impresora no responde desde la red"
      - "No puedo acceder al sistema de nomina"
      - "Pantalla con rayas y artefactos visuales"
      - "Teclado con teclas que no funcionan"
      - "Mouse desconectado intermitentemente"
      - "Correo electronico no sincroniza"
      - "Red WiFi muy lenta en el area de ventas"
      - "Software de facturacion cierra solo"
      - "Escaner no detectado por Windows"
    descripciones:
      - "Al presionar el boton de encendido el equipo no responde, no hay luz ni sonido de arranque. Ya revise el cable de corriente y esta bien conectado."
      - "La impresora HP del area de contabilidad aparece como desconectada en todos los equipos desde ayer por la manana. Ya reinicie el router."
      - "Intento ingresar con mis credenciales y el sistema dice contrasena incorrecta aunque la cambie hace dos dias. Necesito acceso urgente."
      - "La pantalla del equipo de escritorio muestra lineas horizontales de colores y a veces se congela. Ocurre desde que se cayo el equipo."
      - "Las teclas F5, F6 y la tecla de espacio no registran pulsaciones. El teclado es USB y ya lo probe en otro puerto."
      - "El mouse se desconecta cada 10 o 15 minutos y tengo que desconectarlo y volverlo a conectar para que funcione. Es inalambrico."
      - "Los correos del servidor interno no llegan a mi bandeja. Los correos externos si funcionan. Esto ocurre desde el lunes."
      - "La conexion WiFi en el area de ventas es muy lenta, las paginas tardan mucho en cargar y el sistema de punto de venta se desconecta."
      - "El software de facturacion se cierra inesperadamente al intentar generar una factura con mas de 5 productos. Ya reinstale y sigue igual."
      - "El escaner de documentos no aparece en los dispositivos del equipo. Ya instale los drivers del CD y tampoco funciona."
    prioridades:
      - "Alta"
      - "Media"
      - "Baja"
      - "Urgente"
    categorias:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"

scenarios:
  # Usuario 1 — empleado regular (id_rol: 2)
  - name: "Usuario m.lopez crea ticket"
    weight: 15
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "m.lopez@precisiontrucks.com"
            password: "Precisiontrucks.com1"
          capture:
            - json: "$.token"
              as: "jwt"
      - post:
          url: "/api/tickets"
          headers:
            Authorization: "Bearer {{ jwt }}"
          formData:
            titulo: "{{ titulos[0] }}"
            descripcion: "{{ descripciones[0] }}"
            prioridad: "{{ prioridades[0] }}"
            id_categoria: "{{ categorias[0] }}"
          expect:
            - statusCode: 201

