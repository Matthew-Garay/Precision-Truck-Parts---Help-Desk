config:
  target: "http://192.168.1.167:3001"
  phases:
    - duration: 30
      arrivalRate: 3
      name: "Calentamiento"
    - duration: 60
      arrivalRate: 10
      name: "Carga sostenida"
    - duration: 30
      arrivalRate: 20
      rampTo: 50
      name: "Pico de estres"
  defaults:
    headers:
      x-requested-with: "XMLHttpRequest"
      Content-Type: "application/json"

scenarios:
  - name: "m.lopez solicita insumos"
    weight: 20
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "m.lopez@precisiontrucks.com"
            password: "Precisiontrucks.com1"
          capture:
            - json: "$.token"
              as: "jwt"
            - json: "$.usuario.id_empleado"
              as: "id_emp"
      - post:
          url: "/api/solicitudes"
          headers:
            Authorization: "Bearer {{ jwt }}"
          json:
            prioridad: "Media"
            id_empleado: 1
            insumos:
              - id_insumo: 1
                cantidad: 1
          expect:
            - statusCode: 201

